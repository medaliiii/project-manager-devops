apiVersion: v1
kind: Service
metadata:
  name: { { .Values.fullnameOverride | default "server" } }
  labels:
    app: { { .Values.fullnameOverride | default "server" } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: { { .Values.service.port } }
      targetPort: { { .Values.service.port } }
      protocol: TCP
      name: http
  selector:
    app: { { .Values.fullnameOverride | default "server" } }
